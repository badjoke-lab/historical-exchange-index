name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run policy:check
      - run: node --check scripts/configure-cloudflare-pages-project.mjs
      - run: npm run cloudflare:config:print
      - run: npm run lint
      - name: Diagnose record entity overlaps
        run: node scripts/audit-record-entity-overlaps.mjs
      - name: Diagnose record bundle schema
        run: node scripts/validate-record-bundles.mjs
      - name: Diagnose record duplicates
        run: node scripts/check-record-duplicates.mjs
      - name: Diagnose reviewed bundle ID collisions
        run: node scripts/audit-reviewed-bundle-id-collisions.mjs --strict
      - run: npm run counts:test
      - run: npm run counts:check
      - run: node scripts/check-country-or-origin-strict.mjs --self-test
      - run: node scripts/check-country-or-origin-strict.mjs
      - run: npm run backlog:test-scan-integrity
      - run: npm run backlog:check-scan-integrity
      - run: npm run watchlists:test
      - run: node scripts/test-watchlist-candidate-lifecycle.mjs
      - run: node scripts/audit-open-candidate-canonical-overlap.mjs --strict
      - run: npm run watchlists:check
      - run: npm run data:test-entity-quality
      - run: npm run data:check-entity-quality
      - run: npm run recovery:test
      - run: npm run recovery:validate
      - name: Verify public project network against authority
        shell: bash
        run: |
          set -euo pipefail
          authority=config/public-project-network.json
          source=src/lib/project-network.ts
          jq -e '.schema_version == "1.0.0" and (.members | length) >= 1' "$authority" >/dev/null
          while IFS= read -r url; do
            grep -Fq "$url" "$source" || { echo "Missing project network URL: $url"; exit 1; }
          done < <(jq -r '.members[].url' "$authority")
      - run: npm run data:check-event-types
      - run: npm run data:check-official-url-statuses
      - run: npm run data:check-source-types
      - run: npm run data:check-claim-scopes
      - run: npm run data:check-projected-enums
      - run: node --check scripts/check-machine-readable-production.mjs
      - run: node --check scripts/check-record-level-machine-readable-production.mjs
      - run: node --check scripts/check-stats-machine-readable-production.mjs
      - run: npm run build
      - run: npm run machine:validate
      - run: node scripts/validate-record-level-machine-readable.mjs
      - run: node scripts/validate-stats-machine-readable.mjs
      - run: node scripts/validate-ledger-series-phase9-adapter.mjs
      - run: node scripts/validate-ledger-series-registry-index.mjs
      - run: npm run public:validate

  maintenance:
    name: Non-blocking maintenance checks
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Export country or origin audit
        continue-on-error: true
        run: node scripts/audit-country-or-origin.mjs --output=audit-output/country-origin.json
      - name: Upload country or origin audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-origin-audit
          path: audit-output/country-origin.json
          if-no-files-found: warn
          retention-days: 7
      - name: Monitoring smoke test
        continue-on-error: true
        run: npm run monitor:smoke
      - name: Monitoring completion test
        continue-on-error: true
        run: npm run monitor:test-completion
      - name: Validate bounded commercial dataset sample export
        continue-on-error: true
        run: node tools/export-commercial-dataset.mjs --sample-size=5 --source-commit="${GITHUB_SHA}"
