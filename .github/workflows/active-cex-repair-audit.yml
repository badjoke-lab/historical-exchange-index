name: Active CEX repair audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 2'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Publication-safe advisory check
        if: github.event_name == 'pull_request'
        run: echo 'Active CEX full-corpus repair audit is advisory and does not block publication.'
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Generate advisory repair audit
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/audit-thin-active-cex.mjs --strict --output=audit-output/thin-active-cex.json --markdown=audit-output/thin-active-cex.md
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: thin-active-cex-audit
          path: |
            audit-output/thin-active-cex.json
            audit-output/thin-active-cex.md
          if-no-files-found: warn
          retention-days: 14
