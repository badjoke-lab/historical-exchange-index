name: Material concerns batch 01A canonical build

on:
  push:
    branches:
      - agent/material-concerns-batch-01a
    paths:
      - scripts/one-off-material-concerns-batch-01a.mjs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/material-concerns-batch-01a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded corrections
        run: node scripts/one-off-material-concerns-batch-01a.mjs
      - name: Build canonical data from record bundles
        run: npm run records:build
      - name: Validate generated state
        run: |
          npm run records:validate
          npm run counts:check
      - name: Remove one-off migration machinery
        run: |
          rm scripts/one-off-material-concerns-batch-01a.mjs
          rm .github/workflows/material-concerns-batch-01a-build.yml
      - name: Commit generated canonical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: apply batch 01A canonical corrections"
          git push origin HEAD:agent/material-concerns-batch-01a
