name: Wait for Latest BIR Main Production

on:
  push:
    branches:
      - agent/bir-batch15-cloudflare-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Wait for commit 624c9448 production deployment
        shell: bash
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) process.exit(1);
          const projectName = 'bridge-incident-registry';
          const targetCommit = '624c9448c3507d03660d4b01272f0cb881dee5b9';
          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${projectName}`;
          const headers = { Authorization: `Bearer ${token}` };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function get(path = '') {
            const response = await fetch(`${base}${path}`, { headers });
            const body = await response.json().catch(() => null);
            if (!response.ok || !body?.success) {
              console.error(JSON.stringify({ status: response.status, errors: body?.errors ?? [] }, null, 2));
              process.exit(1);
            }
            return body.result;
          }

          for (let attempt = 1; attempt <= 40; attempt += 1) {
            const project = await get();
            if (project.source?.config?.preview_deployment_setting !== 'none') {
              console.error('preview_deployment_setting is not none');
              process.exit(1);
            }
            const deployments = await get('/deployments?page=1&per_page=25');
            const deployment = deployments.find((item) =>
              item.environment === 'production' &&
              item.deployment_trigger?.metadata?.commit_hash === targetCommit
            );
            if (!deployment) {
              console.error('Target production deployment is missing.');
              process.exit(1);
            }
            const summary = {
              attempt,
              id: deployment.id,
              commit_hash: targetCommit,
              created_on: deployment.created_on,
              modified_on: deployment.modified_on,
              stage: deployment.latest_stage?.name,
              status: deployment.latest_stage?.status,
              started_on: deployment.latest_stage?.started_on,
              ended_on: deployment.latest_stage?.ended_on,
              url: deployment.url
            };
            console.log(JSON.stringify(summary, null, 2));
            if (summary.stage === 'deploy' && summary.status === 'success') process.exit(0);
            if (summary.status === 'failure') process.exit(1);
            if (attempt < 40) await sleep(15000);
          }
          process.exit(1);
          NODE
