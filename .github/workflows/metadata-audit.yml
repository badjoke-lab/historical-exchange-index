name: Metadata audit diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: '57 4 * * 2'

jobs:
  metadata-audit:
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run machine:build
      - run: npm run build
      - name: Run metadata audit and write diagnostics
        continue-on-error: true
        run: node scripts/audit-public-metadata-v2.mjs
      - name: Upload metadata audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-metadata-audit
          path: artifacts/public-metadata-audit.json
          if-no-files-found: warn
