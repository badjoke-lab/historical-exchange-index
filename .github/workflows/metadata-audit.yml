name: Metadata audit diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '57 4 * * 2'

jobs:
  metadata-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Publication-safe advisory check
        if: github.event_name == 'pull_request'
        run: echo 'Full metadata diagnostics are advisory and do not block publication.'
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - run: npm run machine:build
        if: github.event_name != 'pull_request'
      - run: npm run build
        if: github.event_name != 'pull_request'
      - name: Run metadata audit and write diagnostics
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/audit-public-metadata-v2.mjs
      - name: Upload metadata audit diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-metadata-audit
          path: artifacts/public-metadata-audit.json
          if-no-files-found: warn
