name: Material concerns retroactive audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  audit:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate retroactive audit index
        run: node scripts/audit-material-concerns-retroactive.mjs
      - name: Print audit summary
        if: always()
        run: cat docs/audits/material-concerns-retroactive-audit-summary.md || true
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-concerns-retroactive-audit
          path: |
            docs/audits/material-concerns-retroactive-audit-index.json
            docs/audits/material-concerns-retroactive-audit-summary.md
          if-no-files-found: warn
