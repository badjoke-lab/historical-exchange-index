name: Phase 9 Stage 4 corrective descriptor collector

on:
  pull_request:
    paths:
      - "scripts/collect-ledger-series-stage4-remote-descriptors.mjs"
      - ".github/workflows/phase9-stage4-corrective-descriptor-collector.yml"

permissions:
  contents: read

jobs:
  collect-descriptors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Collect seven remote production Series descriptors
        run: node scripts/collect-ledger-series-stage4-remote-descriptors.mjs

      - name: Upload reviewed descriptor snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage4-remote-descriptors
          path: stage4-remote-descriptors.json
          if-no-files-found: error
