name: Ledger Series Phase 9 Stage 6 v3 current-production reverification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

jobs:
  review-contract:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.ref == 'agent/phase9-stage6-v3-current-production-verifier' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.title == 'Implement Phase 9 Stage 6 v3 current-production verifier'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify v3 wrapper syntax
        run: node --check scripts/verify-ledger-series-phase9-stage6-current-production-v3.mjs
      - name: Generate and syntax-check bounded runtime verifier
        run: node scripts/verify-ledger-series-phase9-stage6-current-production-v3.mjs --prepare-only
      - name: Verify finite read-only authority and execution baseline
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const authority = JSON.parse(fs.readFileSync('config/ledger-series-phase9-stage6-current-production-reverification-authority-2026-08-23.json', 'utf8'));
          const baseline = JSON.parse(fs.readFileSync('config/ledger-series-phase9-stage6-v3-execution-baseline.json', 'utf8'));
          if (authority.authority_id !== 'hei-ledger-series-phase9-stage6-current-production-reverification-2026-08-23-v3') throw new Error('unexpected v3 authority');
          if (authority.network_read_only_reverification_authorized_after_implementation_merge !== true) throw new Error('network reverification not authorized');
          if (authority.production_mutation_authorized !== false || authority.vertical_repository_mutation_authorized !== false || authority.central_descriptor_resync_authorized !== false) throw new Error('mutation boundary weakened');
          if (baseline.execution_count_authorized !== 1 || baseline.automatic_baseline_refresh_authorized !== false) throw new Error('execution baseline is not finite/fail-close');
          if (baseline.registries?.length !== 8) throw new Error('expected exactly eight execution baselines');
          if (baseline.stage5_relationship_counts?.total !== 244 || baseline.stage5_relationship_counts?.cross_registry !== 0) throw new Error('Stage 5 relationship boundary changed');
          console.log('Stage 6 v3 finite read-only contract PASS');
          NODE

  verify-current-production:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'agent/phase9-stage6-v3-current-production-verifier' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.title == 'Implement Phase 9 Stage 6 v3 current-production verifier'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HEI exact implementation merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Checkout reviewed MAG execution baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/mintedandgone
          ref: f917d5e25eedc7b2c48091c7343b7fa9cd203428
          path: .stage6/repos/mag
          persist-credentials: false
      - name: Checkout reviewed SOG execution baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/stable-or-gone
          ref: e8663a8289033a3a6af7cb19fb31683b2545e61c
          path: .stage6/repos/sog
          persist-credentials: false
      - name: Checkout reviewed CYA execution baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/crypto-yield-archive
          ref: 2f68c520bc1b502f351f22a71fa339b29d473ef7
          path: .stage6/repos/cya
          persist-credentials: false
      - name: Checkout reviewed BIR execution baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/bridge-incident-registry
          ref: 666d1f4f78b7ed12fa36e2741134523a140221c4
          path: .stage6/repos/bir
          persist-credentials: false
      - name: Checkout reviewed WLR execution baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/cryptocurrency-wallet-lifecycle-registry
          ref: 8192dedeb3777894f031dcbd13d95367f5f688de
          path: .stage6/repos/wlr
          persist-credentials: false
      - name: Checkout reviewed AI Tools execution baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/ai-tools-history-archive
          ref: 76ef103329813f0174db121117c932bff53fbf8e
          path: .stage6/repos/ai
          persist-credentials: false
      - name: Checkout reviewed API Deprecation execution baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/api-deprecation-archive
          ref: 641a6d4243d30f95f48436455d2cbc12a8aded53
          path: .stage6/repos/api
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify v3 wrapper syntax
        run: node --check scripts/verify-ledger-series-phase9-stage6-current-production-v3.mjs
      - name: Run one authorized read-only current-production reverification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGE6_HEI_EXECUTION_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STAGE6_REPO_ROOT: .stage6/repos
          STAGE6_RESULT_PATH: .stage6/phase9-stage6-v3-current-production-result.json
          STAGE6_TIMEOUT_MS: "20000"
          STAGE6_CONCURRENCY: "10"
        run: node scripts/verify-ledger-series-phase9-stage6-current-production-v3.mjs
      - name: Upload Stage 6 v3 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-series-phase9-stage6-v3-current-production-${{ github.event.pull_request.merge_commit_sha }}
          path: .stage6/phase9-stage6-v3-current-production-result.json
          if-no-files-found: error
          retention-days: 14
