name: Phase 9 Stage 5 Production Proof

on:
  pull_request:
    paths:
      - '.github/workflows/phase9-stage5-production-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reviewed Ledger Series Stage 5 relationships on production
        env:
          HEI_PRODUCTION_ORIGIN: https://hei.badjoke-lab.com
          HEI_STAGE5_PRODUCTION_ATTEMPTS: 20
          HEI_STAGE5_PRODUCTION_DELAY_MS: 15000
        run: node scripts/verify-ledger-series-stage5-production.mjs
