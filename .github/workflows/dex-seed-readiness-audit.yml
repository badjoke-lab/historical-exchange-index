name: DEX seed readiness audit

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 2'

jobs:
  audit:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate advisory DEX seed readiness audit
        continue-on-error: true
        run: node scripts/audit-dex-seed-readiness.mjs --strict --output=audit-output/dex-seed-readiness.json --markdown=audit-output/dex-seed-readiness.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dex-seed-readiness-audit
          path: |
            audit-output/dex-seed-readiness.json
            audit-output/dex-seed-readiness.md
          if-no-files-found: warn
          retention-days: 14
