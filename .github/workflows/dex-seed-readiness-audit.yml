name: DEX seed readiness audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 2'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Publication-safe advisory check
        if: github.event_name == 'pull_request'
        run: echo 'DEX seed full-corpus readiness audit is advisory and does not block publication.'
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Generate advisory DEX seed readiness audit
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/audit-dex-seed-readiness.mjs --strict --output=audit-output/dex-seed-readiness.json --markdown=audit-output/dex-seed-readiness.md
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: dex-seed-readiness-audit
          path: |
            audit-output/dex-seed-readiness.json
            audit-output/dex-seed-readiness.md
          if-no-files-found: warn
          retention-days: 14
