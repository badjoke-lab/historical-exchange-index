name: Wait for BIR Production Deployment

on:
  push:
    branches:
      - agent/bir-batch15-cloudflare-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Wait for a Batch 15 production deployment to succeed
        shell: bash
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) process.exit(1);

          const projectName = 'bridge-incident-registry';
          const projectPath = `/pages/projects/${projectName}`;
          const apiBase = `https://api.cloudflare.com/client/v4/accounts/${accountId}`;
          const acceptableCommits = new Set([
            '39134a5d7b717c467a49d96b5fd7104047cd0a50',
            '7e13955c725e07ca66e01f7f9e321db7f7c764ff',
            '624c9448c3507d03660d4b01272f0cb881dee5b9'
          ]);

          async function request(path) {
            const response = await fetch(`${apiBase}${path}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const body = await response.json().catch(() => null);
            if (!response.ok || !body?.success) {
              console.error(JSON.stringify({ status: response.status, errors: body?.errors ?? [] }, null, 2));
              process.exit(1);
            }
            return body.result;
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastSummary = null;

          for (let attempt = 1; attempt <= 40; attempt += 1) {
            const project = await request(projectPath);
            if (project.source?.config?.preview_deployment_setting !== 'none') {
              console.error('preview_deployment_setting regressed from none');
              process.exit(1);
            }

            const deployments = await request(`${projectPath}/deployments?page=1&per_page=25`);
            const relevant = deployments
              .filter((deployment) =>
                deployment.environment === 'production' &&
                acceptableCommits.has(deployment.deployment_trigger?.metadata?.commit_hash)
              )
              .map((deployment) => ({
                id: deployment.id,
                commit_hash: deployment.deployment_trigger?.metadata?.commit_hash,
                created_on: deployment.created_on,
                modified_on: deployment.modified_on,
                stage: deployment.latest_stage?.name,
                status: deployment.latest_stage?.status,
                started_on: deployment.latest_stage?.started_on,
                ended_on: deployment.latest_stage?.ended_on,
                url: deployment.url
              }));

            lastSummary = relevant;
            console.log(JSON.stringify({ attempt, relevant_production_deployments: relevant }, null, 2));

            const successful = relevant
              .filter((deployment) => deployment.stage === 'deploy' && deployment.status === 'success')
              .sort((a, b) => new Date(b.created_on) - new Date(a.created_on))[0];

            if (successful) {
              console.log(JSON.stringify({ production_deployment_succeeded: successful }, null, 2));
              process.exit(0);
            }

            const failed = relevant.find((deployment) => deployment.status === 'failure');
            if (failed) {
              console.error(JSON.stringify({ production_deployment_failed: failed }, null, 2));
              process.exit(1);
            }

            if (attempt < 40) await sleep(15000);
          }

          console.error(JSON.stringify({ production_did_not_finish: lastSummary }, null, 2));
          process.exit(1);
          NODE
