name: Diagnose BIR Cloudflare Pages Project

on:
  push:
    branches:
      - agent/bir-batch15-cloudflare-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: List BIR Pages deployment queue without exposing credentials
        shell: bash
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) {
            console.error('Cloudflare account credentials are unavailable in this repository.');
            process.exit(1);
          }
          const projectName = 'bridge-incident-registry';
          const request = async (path) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}${path}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const body = await response.json();
            if (!response.ok || !body?.success) {
              console.error(JSON.stringify({ status: response.status, errors: body?.errors ?? [] }, null, 2));
              process.exit(1);
            }
            return body.result;
          };
          const project = await request(`/pages/projects/${projectName}`);
          console.log(JSON.stringify({
            project: project.name,
            production_branch: project.production_branch,
            preview_deployment_setting: project.source?.config?.preview_deployment_setting,
            production_deployments_enabled: project.source?.config?.production_deployments_enabled,
            deployments_enabled: project.source?.config?.deployments_enabled
          }, null, 2));
          const deployments = await request(`/pages/projects/${projectName}/deployments?per_page=100`);
          console.log(`Deployments returned: ${deployments.length}`);
          for (const deployment of deployments) {
            console.log(JSON.stringify({
              id: deployment.id,
              environment: deployment.environment,
              created_on: deployment.created_on,
              modified_on: deployment.modified_on,
              stage: deployment.latest_stage ? {
                name: deployment.latest_stage.name,
                status: deployment.latest_stage.status,
                started_on: deployment.latest_stage.started_on,
                ended_on: deployment.latest_stage.ended_on
              } : null,
              branch: deployment.deployment_trigger?.metadata?.branch,
              commit_hash: deployment.deployment_trigger?.metadata?.commit_hash,
              commit_message: deployment.deployment_trigger?.metadata?.commit_message,
              url: deployment.url
            }));
          }
          NODE
