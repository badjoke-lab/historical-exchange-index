name: Diagnose BIR Cloudflare Pages Project

on:
  push:
    branches:
      - agent/bir-batch15-cloudflare-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect Pages projects without exposing credentials
        shell: bash
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) {
            console.error('Cloudflare account credentials are unavailable in this repository.');
            process.exit(1);
          }
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const body = await response.json();
          if (!response.ok || !body?.success) {
            console.error(JSON.stringify({ status: response.status, errors: body?.errors ?? [] }, null, 2));
            process.exit(1);
          }
          const projects = body.result ?? [];
          console.log(`Pages projects visible: ${projects.length}`);
          for (const project of projects) {
            const domains = project.domains ?? [];
            const searchable = [project.name, project.subdomain, ...domains].join(' ').toLowerCase();
            if (!/(^|[^a-z])(bir|bridge|incident)([^a-z]|$)/.test(searchable) && !domains.some((d) => d === 'bir.badjoke-lab.com')) continue;
            console.log(JSON.stringify({
              name: project.name,
              subdomain: project.subdomain,
              domains,
              production_branch: project.production_branch,
              source: project.source ? {
                type: project.source.type,
                owner: project.source.config?.owner,
                repo_name: project.source.config?.repo_name,
                production_branch: project.source.config?.production_branch,
                deployments_enabled: project.source.config?.deployments_enabled,
                production_deployments_enabled: project.source.config?.production_deployments_enabled,
                preview_deployment_setting: project.source.config?.preview_deployment_setting,
                path_includes: project.source.config?.path_includes,
                path_excludes: project.source.config?.path_excludes
              } : null,
              latest_deployment: project.latest_deployment ? {
                id: project.latest_deployment.id,
                environment: project.latest_deployment.environment,
                created_on: project.latest_deployment.created_on,
                modified_on: project.latest_deployment.modified_on,
                latest_stage: project.latest_deployment.latest_stage,
                deployment_trigger: project.latest_deployment.deployment_trigger,
                url: project.latest_deployment.url
              } : null
            }, null, 2));
          }
          NODE
