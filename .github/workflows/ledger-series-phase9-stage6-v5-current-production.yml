name: Ledger Series Phase 9 Stage 6 v5 SOG checker correction

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "config/ledger-series-phase9-stage6-v5-execution-baseline.json"
      - "docs/audits/HEI_LEDGER_SERIES_PHASE9_STAGE6_V5_PRE_EXECUTION_BASELINE_2026-08-23.md"
      - "scripts/verify-ledger-series-phase9-stage6-current-production-v5.mjs"
      - ".github/workflows/ledger-series-phase9-stage6-v5-current-production.yml"

permissions:
  contents: read

jobs:
  review-contract:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v5 implementation head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify v5 wrapper syntax
        run: node --check scripts/verify-ledger-series-phase9-stage6-current-production-v5.mjs
      - name: Generate and syntax-check v5 runtime verifier
        run: node scripts/verify-ledger-series-phase9-stage6-current-production-v5.mjs --prepare-only
      - name: Verify v5 authority, SOG correction, and finite baseline
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const authority = JSON.parse(fs.readFileSync('config/ledger-series-phase9-stage6-v5-sog-checker-correction-authority-2026-08-23.json', 'utf8'));
          const baseline = JSON.parse(fs.readFileSync('config/ledger-series-phase9-stage6-v5-execution-baseline.json', 'utf8'));
          const wrapper = fs.readFileSync('scripts/verify-ledger-series-phase9-stage6-current-production-v5.mjs', 'utf8');
          if (authority.authority_id !== 'hei-ledger-series-phase9-stage6-sog-checker-correction-2026-08-23-v5') throw new Error('unexpected v5 authority');
          if (authority.failed_v4_execution?.workflow_run !== 32620749266 || authority.failed_v4_execution?.job_id !== 97148448800 || authority.failed_v4_execution?.artifact_id !== 9488302977) throw new Error('v5 authority is not bound to the consumed v4 execution');
          if (authority.sog_failure_review?.classification !== 'stale_stage5_production_checker_hash_lock_after_reviewed_non_growth_canonical_maintenance') throw new Error('unexpected SOG failure classification');
          const a = authority.authorization || {};
          if (a.v5_implementation_authorized !== true || a.hei_verifier_only_correction_authorized !== true || a.transient_sog_stage5_checker_derivation_authorized !== true) throw new Error('v5 implementation not authorized');
          if (a.network_read_only_reverification_authorized_after_v5_implementation_merge !== true || a.network_execution_count_authorized !== 1) throw new Error('v5 one-shot not authorized');
          if (a.rerun_failed_v4_workflow_authorized !== false || a.automatic_retry_authorized !== false || a.automatic_repair_authorized !== false || a.automatic_baseline_refresh_authorized !== false) throw new Error('v5 retry/repair boundary weakened');
          for (const key of ['production_mutation_authorized','vertical_repository_mutation_authorized','sog_repository_mutation_authorized','canonical_record_mutation_authorized','relationship_mutation_authorized','central_descriptor_resync_authorized','cloudflare_dns_deployment_mutation_authorized','stage7_continuation_authorized','stage8_continuation_authorized','phase10_continuation_authorized']) {
            if (a[key] !== false) throw new Error('v5 forbidden boundary weakened: ' + key);
          }
          if (baseline.authority_id !== authority.authority_id || baseline.authority_merge !== '8b4b7042edb154ce394e65b98dfb1a1a0bdd9951' || baseline.execution_count_authorized !== 1 || baseline.registries?.length !== 8) throw new Error('v5 finite baseline mismatch');
          const byId = new Map(baseline.registries.map((x) => [x.registry_id, x]));
          const expected = {
            'historical-exchange-index':'8b4b7042edb154ce394e65b98dfb1a1a0bdd9951',
            'minted-and-gone':'f917d5e25eedc7b2c48091c7343b7fa9cd203428',
            'stable-or-gone':'e8663a8289033a3a6af7cb19fb31683b2545e61c',
            'crypto-yield-archive':'fa35d291a67b2e367f8f7e759a635a0804116680',
            'bridge-incident-registry':'666d1f4f78b7ed12fa36e2741134523a140221c4',
            'cryptocurrency-wallet-lifecycle-registry':'8192dedeb3777894f031dcbd13d95367f5f688de',
            'ai-tools-history-archive':'76ef103329813f0174db121117c932bff53fbf8e',
            'api-deprecation-archive':'641a6d4243d30f95f48436455d2cbc12a8aded53'
          };
          for (const [id, sha] of Object.entries(expected)) {
            const item = byId.get(id);
            if (!item || (item.reviewed_main || item.reviewed_main_before_implementation) !== sha) throw new Error(id + ': exact reviewed main changed');
          }
          const sog = byId.get('stable-or-gone');
          if (sog.expected_current_canonical_hash !== 'sha256:bba93c1e3f0ea1b050cd395455327b70fb7c1920d37b18c300949bb49df53965') throw new Error('SOG current reviewed hash changed');
          if (sog.historical_stage5_authority_hash !== 'sha256:4e7570b6fab88a8178a01ae280a36d98787573b376440b891491f25469458798') throw new Error('SOG historical Stage 5 hash changed');
          if (sog.expected_primary_records !== 119 || sog.expected_series_records !== 119 || sog.expected_relationships !== 1) throw new Error('SOG reviewed counts changed');
          if (JSON.stringify(sog.relationship_tuple) !== JSON.stringify(['predecessor_of','stable-or-gone:stablecoin:sog_st_sai','stable-or-gone:stablecoin:sog_st_dai'])) throw new Error('SOG relationship tuple changed');
          if (!wrapper.includes(".stage6-v5-verify-stage5-production.mjs") || !wrapper.includes("patch_count: 2") || !wrapper.includes("manifest?.build?.canonical_data_hash !== expectedCanonicalHash")) throw new Error('v5 transient SOG checker contract missing');
          if (baseline.stage5_relationship_counts?.total !== 244 || baseline.stage5_relationship_counts?.cross_registry !== 0) throw new Error('Stage 5 relationship boundary changed');
          if (baseline.production_mutation_authorized !== false || baseline.vertical_repository_mutation_authorized !== false || baseline.sog_repository_mutation_authorized !== false || baseline.central_descriptor_resync_authorized !== false || baseline.automatic_baseline_refresh_authorized !== false) throw new Error('v5 baseline mutation boundary weakened');
          console.log('Stage 6 v5 authority/baseline/transient-checker contract PASS');
          NODE

  verify-current-production-v5:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.title == 'Implement Phase 9 Stage 6 v5 SOG checker correction' &&
      github.event.pull_request.head.ref == 'agent/phase9-stage6-v5-sog-checker-correction'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact v5 implementation merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Checkout reviewed MAG baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/mintedandgone
          ref: f917d5e25eedc7b2c48091c7343b7fa9cd203428
          path: .stage6/repos/mag
          persist-credentials: false
      - name: Checkout reviewed SOG baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/stable-or-gone
          ref: e8663a8289033a3a6af7cb19fb31683b2545e61c
          path: .stage6/repos/sog
          persist-credentials: false
      - name: Checkout reviewed CYA repository main
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/crypto-yield-archive
          ref: fa35d291a67b2e367f8f7e759a635a0804116680
          path: .stage6/repos/cya
          persist-credentials: false
      - name: Checkout reviewed BIR baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/bridge-incident-registry
          ref: 666d1f4f78b7ed12fa36e2741134523a140221c4
          path: .stage6/repos/bir
          persist-credentials: false
      - name: Checkout reviewed WLR baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/cryptocurrency-wallet-lifecycle-registry
          ref: 8192dedeb3777894f031dcbd13d95367f5f688de
          path: .stage6/repos/wlr
          persist-credentials: false
      - name: Checkout reviewed AI baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/ai-tools-history-archive
          ref: 76ef103329813f0174db121117c932bff53fbf8e
          path: .stage6/repos/ai
          persist-credentials: false
      - name: Checkout reviewed API baseline
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/api-deprecation-archive
          ref: 641a6d4243d30f95f48436455d2cbc12a8aded53
          path: .stage6/repos/api
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify v5 runtime generation before network execution
        run: node scripts/verify-ledger-series-phase9-stage6-current-production-v5.mjs --prepare-only
      - name: Run one authorized read-only v5 eight-registry equality check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGE6_HEI_EXECUTION_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STAGE6_REPO_ROOT: .stage6/repos
          STAGE6_RESULT_PATH: .stage6/phase9-stage6-v5-current-production-result.json
          STAGE6_TIMEOUT_MS: "20000"
          STAGE6_CONCURRENCY: "10"
        run: node scripts/verify-ledger-series-phase9-stage6-current-production-v5.mjs
      - name: Upload Stage 6 v5 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-series-phase9-stage6-v5-current-production-${{ github.event.pull_request.merge_commit_sha }}
          path: .stage6/phase9-stage6-v5-current-production-result.json
          if-no-files-found: error
          retention-days: 14
